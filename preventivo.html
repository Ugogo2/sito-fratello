<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Michele Badi">
  <meta
    name="description"
    content="Richiedi un preventivo allo Studio Tecnico Badi di Varese."
  >
  <title>Studio Tecnico Badi - Preventivo</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Studio Tecnico Badi</h1>
    <nav>
      <ul>
        <li>
          <a href="index.html">Home</a>
        </li>
        <li>
          <a href="servizi.html">Servizi</a>
        </li>
        <li>
          <a href="contatti.html">Contatti</a>
        </li>
        <li>
          <a href="preventivo.html">Preventivo</a>
        </li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h2>Richiedi un preventivo</h2>
      <p>
        Compila il modulo per descrivere la tua richiesta.
        Ti ricontatterò per approfondire le tue esigenze
        e fornirti tutte le informazioni necessarie.
      </p>
      <form
        action="https://formspree.io/f/xgavzyov"
        method="POST"
      >
        <div>
          <label for="nome">
            Nome e cognome *
          </label>
          <input
            type="text"
            id="nome"
            name="nome"
            required
            placeholder="Mario Rossi"
          >
        </div>
        <div>
          <label for="email">
            Email *
          </label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="mario@email.it"
          >
        </div>
        <div>
          <label for="telefono">
            Telefono
          </label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="333 1234567"
          >
        </div>
        <div>
          <label for="servizio">
            Servizio richiesto *
          </label>
          <select
            id="servizio"
            name="servizio"
            required
          >
            <option value="">
              -- Seleziona un servizio --
            </option>
            <option value="Pratiche edilizie">
              Pratiche edilizie
            </option>
            <option value="Pratiche catastali">
              Pratiche catastali
            </option>
            <option value="Topografia">
              Topografia
            </option>
            <option value="Rilievi">
              Rilievi
            </option>
            <option value="Altro">
              Altro
            </option>
          </select>
        </div>
        <div>
          <label for="messaggio">
            Descrivi la tua richiesta *
          </label>
          <textarea
            id="messaggio"
            name="messaggio"
            rows="8"
            required
            placeholder="Descrivi brevemente il lavoro di cui hai bisogno..."
          ></textarea>
        </div>
        <div>
          <label>
            <input
              type="checkbox"
              name="privacy"
              value="accettata"
              required
              >
            Ho letto l'informativa sulla privacy *
          </label>
        </div>
        <button type="submit">
          Invia richiesta
        </button>
      </form>
    </section>
  </main>
  <footer>
    <p>
      &copy; 2026 Studio Tecnico Badi - Tutti i diritti riservati
    </p>
  </footer>
</body>
</html>
